
<div class="filters flex flex-col pt-5 px-5">
  <div class="title ">
    <span>FILTROS DE BUSQUEDA</span>
  </div>
  <div class="filters">
    <form [formGroup]="filterForm" class="flex w-full flex-row justify-between px-5">
        <!-- Text Input -->
        <div class="w-[20%]">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Nombre
          </label>
          <input formControlName="name"
            type="text"
            placeholder="Escribe tu nombre..."
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300
                   text-gray-900 placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                   transition-shadow"
          />
        </div>
       <!-- Select -->
        <div class="w-[20%]">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Genero
          </label>
          <select formControlName="gender"
            class=" w-full px-4 py-2.5 rounded-lg border border-gray-300
                   text-gray-900 bg-white
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                   transition-shadow cursor-pointer"
          >
            <option value="" disabled selected>Selecciona un país</option>
            @for (pais of gender(); track pais) {
              <option [value]="pais">{{ pais }}</option>
            }
          </select>
        </div>
       <!-- Select -->
        <div class="w-[20%]">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Raza
          </label>
          <select formControlName="race"
            class=" w-full px-4 py-2.5 rounded-lg border border-gray-300
                   text-gray-900 bg-white
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                   transition-shadow cursor-pointer"
          >
            <option value="" disabled selected>Selecciona un país</option>
            @for (pais of race(); track pais) {
              <option [value]="pais">{{ pais }}</option>
            }
          </select>
        </div>
       <!-- Select -->
        <div class="w-[20%]">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Afiliación
          </label>
          <select formControlName="affiliation"
            class=" w-full px-4 py-2.5 rounded-lg border border-gray-300
                   text-gray-900 bg-white
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                   transition-shadow cursor-pointer"
          >
            <option value="" disabled selected>Selecciona un país</option>
            @for (pais of affiliation(); track pais) {
              <option [value]="pais">{{ pais }}</option>
            }
          </select>
        </div>
    </form>
    <div class="search flex justify-end m-[10px]">
      <button (click)="filterForm.reset()" type="button" class="px-4 py-2.5 mx-5 text-sm font-medium rounded-xl border bg-white text-gray-600 border-gray-200 shadow-sm hover:bg-indigo-50 hover:text-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 ">Limpiar</button>
      <button (click)="search()" type="button" class="px-4 py-2.5 mx-5 text-sm font-medium rounded-xl border bg-white text-gray-600 border-gray-200 shadow-sm hover:bg-indigo-50 hover:text-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 ">Buscar</button>
    </div>
  </div>
</div>
