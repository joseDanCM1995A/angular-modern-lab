<!-- 1. Contenedor: recorta todo lo que se salga -->
 <h4 class="mt-3">TRANSFORMACIONES</h4>
    <div class="relative w-[30%] h-[70%] max-w-4xl mx-auto overflow-hidden rounded-full">
      <!-- 2. Track: se mueve con translateX -->
      <div
        class="flex transition-transform duration-500 ease-in-out"
        [style.transform]="'translateX(-' + (current() * 100) + '%)'"
      >
        @for (img of images(); track $index) {
          <!-- 3. Slide: overflow-hidden + min-w-0 para que no desborde -->
          <div class="w-full shrink-0 min-w-0 h-64 md:h-96 overflow-hidden">
            <!-- 4. Imagen: block elimina el gap inline, object-cover recorta -->
            <img [src]="img.image" class="w-full h-full object-contain block" />
          </div>
        }
      </div>

      <button
        (click)="prev()"
        class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white p-2 rounded-full hover:bg-black/70"
      >
        &#10094;
      </button>
      <button
        (click)="next()"
        class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white p-2 rounded-full hover:bg-black/70"
      >
        &#10095;
      </button>
    </div>
