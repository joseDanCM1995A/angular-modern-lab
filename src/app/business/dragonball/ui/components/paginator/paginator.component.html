<div class="h-full flex justify-center items-center">
  <nav class="flex h-3/5 w-auto items-center justify-between p-4 rounded-lg shadow-md">
   <button (click)="changePage(-1)"
    [disabled]="metaInput().currentPage === 1"
    class="px-4 py-2.5 mx-10 text-sm font-medium rounded-xl border
           bg-white text-gray-600 border-gray-200 shadow-sm
           hover:bg-indigo-50 hover:text-indigo-700
           disabled:opacity-50 disabled:cursor-not-allowed
           transition-all duration-200">
  Anterior
</button>
    <div class="w-full">
      <div class="flex flex-col justify-center items-center text-xs text-gray-500 mb-1">
        <span>{{metaInput().currentPage}}  de {{metaInput().totalPages}}</span>
        <span>{{metaInput().totalItems}} elementos</span>
      </div>
    </div>
   <button (click)="changePage(+1)"
    [disabled]="metaInput().currentPage === metaInput().totalPages"
    class="px-4 py-2.5 mx-10 text-sm font-medium rounded-xl border
           bg-white text-gray-600 border-gray-200 shadow-sm
           hover:bg-indigo-50 hover:text-indigo-700
           disabled:opacity-50 disabled:cursor-not-allowed
           transition-all duration-200">
  Siguiente
</button>
  </nav>
</div>
